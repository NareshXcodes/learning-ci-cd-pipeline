name : nodejs application using AWS

on :
  push:
    branches:
      - main

jobs :
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name : Checkout Code
        uses : actions/checkout@v4

      - name : Deploy Via SSH
        uses : appleboy/ssh-action@v1.0.3
        with :
          host : ${{ secrets.SSH_HOST }}
          username : ubuntu
          key : ${{ secrets.SSH_KEY }}
          port : 22
          script : |
            cd /home/ubuntu/learning-ci-cd-pipeline
            git pull
            docker compose up -d --build

